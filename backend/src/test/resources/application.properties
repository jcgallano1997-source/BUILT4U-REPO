# Test-only overrides (merged over application.yml; other keys unchanged).
# Neutralise the per-IP login rate limiter for the suite — the shared filter
# bean accumulates 127.0.0.1 attempts across every IT's logins, which would
# otherwise trip the prod limit. RateLimitFlowIT sets its own low limit in an
# isolated context to exercise the 429 path.
app.security.login-rate.max-attempts=100000
