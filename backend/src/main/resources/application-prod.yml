# =============================================================================
# Production profile — activate with SPRING_PROFILES_ACTIVE=prod.
# Every secret comes from the environment; several have NO default on purpose so
# the app fails fast at startup if they are missing (fail-closed):
#   DB_URL, DB_USERNAME, DB_PASSWORD   — Oracle ADB (wallet dir via TNS_ADMIN)
#   JWT_SECRET                         — >= 64-byte HS512 signing key
#   APP_CORS_ALLOWED_ORIGINS           — the deployed frontend origin(s), comma-separated
#   APP_SECURITY_SEED_ADMIN_PASSWORD   — bootstrap admin password (DataSeeder rejects the weak default here)
# =============================================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: Built4uPos-HikariPool-Prod
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1 FROM DUAL
  jpa:
    show-sql: false

server:
  # Don't leak internals in container-level error responses (defense in depth;
  # the app's own handler already returns terse JSON).
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  # Honor X-Forwarded-* from the platform's TLS-terminating proxy (Render etc.)
  forward-headers-strategy: framework

logging:
  level:
    com.built4u.pos: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

app:
  jwt:
    secret: ${JWT_SECRET}                       # REQUIRED — no default in prod
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS} # REQUIRED — deployed frontend origin(s)
  security:
    hsts-enabled: ${APP_SECURITY_HSTS_ENABLED:true}
    seed-admin-password: ${APP_SECURITY_SEED_ADMIN_PASSWORD}  # REQUIRED (weak default rejected)
