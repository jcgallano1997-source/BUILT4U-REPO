spring:
  application:
    name: built4u-pos-backend
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only validates
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

  # Flyway — single-business POS schema lives in the BUILT4U Oracle schema.
  # Its own migration ledger (default flyway_schema_history in BUILT4U) is
  # completely separate from the live FREEPOS schema.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8083}          # 8083: keep clear of FreePOS(8082) & Built4U_Web(8080)

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# Application config (no secrets here — those come from the profile/env)
app:
  jwt:
    access-ttl-ms: 900000       # 15 min
    refresh-ttl-ms: 604800000   # 7 days
  security:
    # Forces password rotation after N days (0 disables). Runtime check only.
    password-max-age-days: ${APP_SECURITY_PASSWORD_MAX_AGE_DAYS:90}
    # One-shot bootstrap password for the seeded 'admin' user (force-change on
    # first login). MUST be overridden under the 'prod' profile (DataSeeder fails closed).
    seed-admin-password: ${APP_SECURITY_SEED_ADMIN_PASSWORD:admin123}
