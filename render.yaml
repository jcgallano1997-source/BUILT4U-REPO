# Render Blueprint for Built4U POS (single-business).
# Import via Render → New → Blueprint, pointed at this repo. Verify keys against
# the current Render schema (see DEPLOYMENT.md for the dashboard alternative and
# the full env-var list). Secrets marked `sync: false` are entered in the
# dashboard; the Oracle wallet is uploaded as Secret Files (NOT committed).
services:
  # ── Backend: Spring Boot API (Docker) ──────────────────────────────────────
  - type: web
    name: built4u-pos-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Free/Starter instances are small. Without this the JVM takes only ~25% of
      # the container for heap; 70% leaves room for the JVM's own overhead while
      # giving reports and .xlsx handling (POI) something to work with.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70
      - key: DB_POOL_MAX
        value: "5"
      # Oracle wallet uploaded as Secret Files; point the thin driver at them.
      - key: TNS_ADMIN
        value: /etc/secrets
      - key: DB_URL
        value: jdbc:oracle:thin:@built4u_low
      - key: DB_USERNAME
        sync: false          # built4u
      - key: DB_PASSWORD
        sync: false          # the BUILT4U schema password
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong value once
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false          # the static site's public URL, e.g. https://built4u-pos-web.onrender.com
      - key: APP_SECURITY_SEED_ADMIN_PASSWORD
        sync: false          # first-run admin bootstrap password (force-changed on first login)
      - key: APP_SECURITY_HSTS_ENABLED
        value: "true"
      # Report email via Resend (domain built4u-pos.com is verified).
      - key: APP_MAIL_RESEND_API_KEY
        sync: false          # the re_... sending key
      - key: APP_MAIL_FROM
        value: Built4U <reports@built4u-pos.com>

  # ── Frontend: static React build ────────────────────────────────────────────
  - type: web
    name: built4u-pos-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # the API's public URL + /api, e.g. https://built4u-pos-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
